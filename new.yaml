<launch>

  <arg name="image_frame" description="E.g., camera0/camera_optical_link"/>
  <arg name="lidar_frame" description="E.g., os_sensor"/>

  <arg name="camera_optical_link_frame"
       default="camera_optical_link_frame"
       description="Camera optical frame for calibration"/>

  <arg name="image_decompressed_topic"
       default="/sensing/camera/camera0/image_rect_color/decompressed"/>
	
  <arg name="image_compressed_topic"
       default="/sensing/camera/camera0/image_rect_color/compressed"/>

  <arg name="camera_info_topic"
       default="/camera_info"/>

  <arg name="pointcloud_topic"
       default="/sensing/lidar/top/pointcloud_raw"/>

  <arg name="use_rectified_image" default="true"/>
  <arg name="view_only_ui" default="true"/>

  <arg name="lidar_model">
    <choice value="ouster_os1_128"/>
    <choice value="ouster_os2"/>
  </arg>

  <let name="rviz_profile"
       value="$(find-pkg-share tag_based_pnp_calibrator)/rviz/default_profile.rviz"/>

  <node pkg="autoware_image_transport_decompressor"
        exec="image_transport_decompressor_node"
        name="decompressor"
        output="screen">

    <remap from="decompressor/input/compressed_image"
           to="$(var image_compressed_topic)"/>

    <remap from="decompressor/output/raw_image"
           to="$(var image_decompressed_topic)"/>
  </node>

  <include file="$(find-pkg-share tag_based_pnp_calibrator)/launch/calibrator.launch.xml">

    <arg name="image_topic" value="$(var image_decompressed_topic)"/>
    <arg name="camera_info_topic" value="$(var camera_info_topic)"/>
    <arg name="pointcloud_topic" value="$(var pointcloud_topic)"/>
    <arg name="lidar_model" value="$(var lidar_model)"/>
    <arg name="use_rectified_image" value="$(var use_rectified_image)"/>
    <arg name="calibration_service_name" value="calibrate_camera_lidar"/>

    <arg name="camera_optical_link_frame"
         value="$(var camera_optical_link_frame)"/>

  </include>

  <node pkg="interactive_camera_lidar_calibrator"
        exec="interactive_calibrator"
        name="interactive_calibrator"
        output="screen"
        if="$(eval &quot;'$(var view_only_ui)' == 'false' &quot;)">

    <remap from="pointcloud" to="$(var pointcloud_topic)"/>
    <remap from="image" to="$(var image_compressed_topic)"/>
    <remap from="camera_info" to="$(var camera_info_topic)"/>

    <param name="image_frame" value="$(var image_frame)"/>
    <param name="lidar_frame" value="$(var lidar_frame)"/>

  </node>

  <node pkg="tier4_calibration_views"
        exec="image_view_node.py"
        name="image_view_node_py"
        output="screen"
        if="$(eval &quot;'$(var view_only_ui)' == 'true' &quot;)">

    <remap from="pointcloud" to="$(var pointcloud_topic)"/>
    <remap from="image" to="$(var image_compressed_topic)"/>
    <remap from="camera_info" to="$(var camera_info_topic)"/>

    <param name="image_frame" value="$(var image_frame)"/>
    <param name="lidar_frame" value="$(var lidar_frame)"/>

  </node>

  <node pkg="tf2_ros"
        exec="static_transform_publisher"
        name="estimated_base_link_broadcaster"
        output="screen"
        args="0 0 0 0 0 0 $(var lidar_frame) lidar_frame"/>

  <node pkg="rviz2"
        exec="rviz2"
        name="rviz2"
        output="screen"
        args="-d $(var rviz_profile)">

    <remap from="pointcloud_topic_placeholder"
           to="$(var pointcloud_topic)"/>
  </node>

</launch>
